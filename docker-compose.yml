services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./data/deskpilot.db
    volumes:
      - ./backend/data:/app/data
      # Cache des modèles Whisper : évite de les retélécharger à chaque recréation du conteneur
      - whisper-cache:/root/.cache/huggingface

  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  whisper-cache:
