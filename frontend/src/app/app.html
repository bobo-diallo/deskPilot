<header class="topbar">
  <h1>{{ 'app.title' | transloco }}</h1>
  <div class="lang" role="group" [attr.aria-label]="'app.language' | transloco">
    @for (lang of languages; track lang) {
      <button
        type="button"
        [attr.data-lang]="lang"
        [class.active]="isActive(lang)"
        (click)="setLanguage(lang)"
      >
        {{ lang.toUpperCase() }}
      </button>
    }
  </div>
</header>

<nav [attr.aria-label]="'app.navigation' | transloco">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{
    'nav.home' | transloco
  }}</a>
  <a routerLink="/evaluation" routerLinkActive="active">{{ 'nav.evaluation' | transloco }}</a>
</nav>

<main>
  <router-outlet />
</main>
