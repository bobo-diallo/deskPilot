name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, black, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: black --check app tests
      # Aucune clé API ici : les tests utilisent des faux fournisseurs, et ceux qui exigent un
      # modèle local (Whisper, embeddings) s'ignorent tout seuls s'il n'est pas téléchargé.
      - run: pytest

  frontend:
    name: Frontend (tests Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Même version de npm que celle qui a généré package-lock.json (voir CLAUDE.md).
      - run: npx --yes npm@11.19.1 ci
      - run: npx ng test --watch=false

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tout l'historique : une clé supprimée plus tard reste lisible dans un ancien commit
      - name: Installer gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner -v
